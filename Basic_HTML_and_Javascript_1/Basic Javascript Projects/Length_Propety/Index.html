
<!-- Length  Property Challenge -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Length Property </title>
</head>
<body>

<h3>Javascript Strings</h3>
<h5>The Lenght of Property</h5>

<P>The lenght Property returns the   lenght of a string. 
<br>
The lenght Property of an empty string is 0.
</P>
<P>Find the lenght of: "How are you sixtus!"</P>
<p id="find"></p>
 
<script>
    var text = "How are you sixtus!";
var lenght = text.length;
document.getElementById("find").innerHTML = lenght;
</script>

</body>
</html>
