 <!-- React_3.html -->
 <!DOCTYPE html>
<html>
    <head>
        <title>React_3</title>
         <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
         <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
         <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> <!-- Referencing React via a URL --> 
    </head>
    <body>
        <div id="JSX"></div>

    <script type="text/babel">
        class Greeting extends React.Component { 
            render() {  
                return <h1>Hello, Mr Robbison!</h1>  
            }
        }
        ReactDOM.render(<Greeting />, document.getElementById('JSX'))
        //"React.Component" is used to specify a class or function
        //"class" above specifies a class
        //"render()" is used to create a function in React
        // "return" statement returns information
    </script>
    </body>
</html>
