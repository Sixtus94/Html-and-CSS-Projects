<!DOCTYPE html>
<html>
  <head>
    <title>React_1</title>
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
  </head>
  <body>
    <div id="My_React_Code"></div>
    <script>
      class Counter extends React.Component {
        render() {
          var timePassed = Math.round(this.props.timePassed / 100);
          var secondsPassed = timePassed / 10 + (timePassed % 10 ? '' : '.0');
          var text = 'My React code started running ' + secondsPassed + ' seconds ago!';
          return React.createElement('p', null, text);
        }
      }

      var startCounting = new Date().getTime();
      setInterval(function() {
        ReactDOM.render(
          React.createElement(Counter, { timePassed: new Date().getTime() - startCounting }),
          document.getElementById('My_React_Code')
        );
      }, 50);
    </script>
  </body>
</html>
