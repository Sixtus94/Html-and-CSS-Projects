<!-- A css zoom In & Out Effect -->

 <!DOCTYPE html>
 <html>
    <head>
    <style>
        /* Image Effect */
        .single-featured-image-header img {
         width: 100%;
         height: 500px;
         object-fit: cover;
         animation: zoomInOut  15s infinite;
        }
   
 @keyframes zoomInOut {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
    }
}
    </style>
    </head>
    <body>
        <h2>A css Image Zoom In & Out Effect</h2>
        <header class="single-featured-image-header">
            <img src="./CSS/Img/leave.jpg" alt="nature Image">
        </header>
    </body>
 </html>
