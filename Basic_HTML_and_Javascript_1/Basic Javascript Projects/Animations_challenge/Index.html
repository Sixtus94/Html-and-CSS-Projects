<!--CSS Animation Key@frame -->
<!DOCTYPE html>
<html>
<head>
<style> 
/* CSS */ 
.animate-element {
  width: 100px;
  height: 100px;
  background-color: red;
  position: relative;
  animation: moveElement 5s infinite;
}

@keyframes moveElement {
  0%   {
    top: 0px;
    left: 0px; 
    background-color: red;
 }
  25% {
    top: 200px;
    left: 200px; 
    background-color:blue; 
    
 }
50% {
    top: 400px;
    left: 0px;
    background-color: green;

 }
75% {
    top: 200px;
    left: -200px;
    background-color: yellow;
 }
100% {
    top: 0px;
    left: 0px;
    background-color: red;
 }
}
@keyframes zoominoutsinglefeatured {
    0% {
        transform: scale(1,1);
    }
    50% {
        transform: scale(1.2,1.2);
    }
    100% {
        transform: scale(1,1);
    }
}

</style>
</head>
<body>

<h1>The @keyframes</h1>
<div class="animate-element">Animate Me!</div>

</body>
</html>
