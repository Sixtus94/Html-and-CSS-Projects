<!DOCTYPE html>
<html>
    <head>
        <title>Object constructors</title>
    </head>
<body>
<h1>JavaScript Object Constructors</h1>

<p id="age_one"></p>
<p id="age_two"></p>

<script>
    // Constructor Function for Person objects
    function Person(first, last, age, eye) {
      this.firstName = first;
      this.lastName = last;
      this.age = age;
      this.eyeColor = eye;
    }
    
    // Create a Person object
 const myfather = new Person("Cliton", "Dube", 64, "blue");
    
    // Display age
    document.getElementById("age_one").innerHTML =
    "My father is " + myfather.age + "."; 
 </script>
    
 <script>
 // Constructor function for Person objects
 function Person(first, last, age, eye) {
  this.firstName = first;
  this.lastName = last;
  this.age = age;
  this.eyeColor = eye;
 }
 // Create two Person objects
 const myFather = new Person("Jack", "Magnus", 40, "blue");
 const myMother = new Person("Lovet", "Dorcas", 39, "green");

 // Display age
 document.getElementById("age_two").innerHTML =
 "My father is " + myFather.age + ". My mother is " + myMother.age + "."; 
</script>
</body>
 </html>
