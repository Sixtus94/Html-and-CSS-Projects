
<!-- Creating A Slideshow: Project9_countdown_slideshow Assignment -->
 <!-- step 1) HTML -->

 <!-- index.html -->

<!Doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Project9_countdown_slideshow</title>
    <link rel="stylesheet" type="text/css" href="./css/main.css">
</head>

<body>
    <!-- countdown Timer Section -->
     <p>How many seconds would you like to set your alarms for?</p>
     <input type="number"  id="seconds" value="" />
     <button onclick="countdown()" id="startBtn">click here</button>
     <p id="timer"></p>


    <!-- Slideshow Container Section -->
  <div class="slideshow-container">
     <!-- Full width images with number and caption text -->
      <div class="myslides fade">
          <div class="numbertext">1 / 3</div>
          <img src="./CSS/Img/car1.jpg" style="width: 100%" alt="Blue lamborghini">
          <div class="text">Hiltop road</div>
      </div>


      <div class="myslides fade">
          <div class="numbertext">2 / 3</div>
          <img src="./CSS/Img/car2.jpg" style="width:100%" alt="Red lamborghini">
          <div class="text">lightGrey Road</div>
      </div>

      <div class="myslides fade">
          <div class="numbertext">3 / 3</div>
          <img src="./CSS/Img/car3.jpg" style="width: 100%" alt="Black mercedes Benz">
          <div class="text">Skye Blue cloud</div>
      </div>


      <!-- Next and previous bttons -->
       <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
       <a class="next" onclick="plusSlides(1)">&#10095;</a>
  </div>
  <br>

  <!-- The dots/ current selection circles -->
   <div style="text-align: center">
     <span class="dot" onclick="currentSlide(1)"></span>
     <span class="dot" onclick="currentSlide(2)"></span>
     <span class="dot" onclick="currentSlide(3)"></span>
   </div>
     <script src="JS/main.js"></script>
</body>
</html>
