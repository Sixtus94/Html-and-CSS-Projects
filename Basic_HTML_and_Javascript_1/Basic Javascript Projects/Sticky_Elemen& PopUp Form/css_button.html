<!-- CSS Button.html -->

<!DOCTYPE html>
<html>
<head>
<title>css button</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
   #contact-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #4CAF50;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  } 
  #contact-button:hover {
    background-color: #3e8e41;
  }
</style>

</head>
<body>

    <button id="contact-button" onclick="openContactForm()">Contact Us</button>

<script>
// #Javascript
function openContactForm() {
  // Add your contact form logic here
  // For example, you can open a modal window or redirect to a contact page
  alert("Contact form coming soon!");
}
</script>
</body>
</html>
