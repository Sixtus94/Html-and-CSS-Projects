<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
<body>

<h2>Forms</h2>

<form name="Form"  action=" " onsubmit="return validateForm()" method="post">
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname" value=" "><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname" value=" "><br>
  <label for="email">Email:</label><br>
  <input type="text" id="email" name="email" value=" "><br>
  <label for="phone">phone Number:</label><br>
  <input type="tel" id="phone" name="phone"><br>
  <input type="submit" value="submit">
</form> 
<br>

<form name="Form"  action=" " onsubmit="return validateForm()" method="post">
    <label for="fname">First Name:</label><br>
    <input type="text" placeholder="Please enter your First name here"><br>
    <label>LastName:</label><br>
    <input type="text" placeholder="Please enter your lname here"><br>
    <label>Email:</label><br>
    <input type="text" id="Email" name="Email" placeholder="Please enter your email here"><br>
    <label>phone Number:</label><br>
    <input type="tel" id="phone" name="phone" placeholder="Please enter your phone here"><br>
    <button class="btn btn-primary" type="submit">Submit form</button>
</form>
<br>

<!-- column Form (Bootstap5 )-->
<form name="Form" action=" ">
    <div class="form-row">
      <div class="col-md-4 mb-3">
        <label for="fname">First name</label>
        <input type="text" class="form-control" id="validationDefault01" placeholder="First name" value=" " required>
      </div>
      <div class="col-md-4 mb-3">
        <label for="lname">Last name</label>
        <input type="text" class="form-control" id="validationDefault02" placeholder="Last name" value=" " required>
      </div>
      <div class="col-md-4 mb-3">
        <label for="Username">Username</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text" id="inputGroupPrepend2">@</span>
          </div>
          <input type="text" class="form-control" id="validationDefaultUsername" placeholder="Username" aria-describedby="inputGroupPrepend2" required>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="col-md-6 mb-3">
        <label for="city">City</label>
        <input type="text" class="form-control" id="validationDefault03" placeholder="City" required>
      </div>
      <div class="col-md-3 mb-3">
        <label for="validationDefault04">State</label>
        <input type="text" class="form-control" id="validationDefault04" placeholder="State" required>
      </div>
      <div class="col-md-3 mb-3">
        <label for="validationDefault05">Zip</label>
        <input type="text" class="form-control" id="validationDefault05" placeholder="Zip" required>
      </div>
    </div>
    <div class="form-group">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
        <label class="form-check-label" for="invalidCheck2">
          Agree to terms and conditions
        </label>
      </div>
    </div>
    <button class="btn btn-primary" type="submit">Submit form</button>
  </form>

  <script>
    function validateForm() {
      var x = document.forms["Form"]
      ["fname"].value;
        if (x == "") {
          alert("Name must be filled out");
          return false;
        }
    }
  </script>
</body>
</html>
