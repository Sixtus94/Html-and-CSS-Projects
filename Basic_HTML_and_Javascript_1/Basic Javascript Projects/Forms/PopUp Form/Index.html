
<!--popup form using HTML, CSS, and JavaScript-->
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>     /*CSS */
body {font-family: Arial, Helvetica, sans-serif;}
* {box-sizing: border-box;}

/* Style the popup container */
.popup-container {
  position: fixed;
  top: 0;
  right: 15px;
  bottom: 0;
  left: 0;
  background-color: rgba(0, 0, 0, 0.5);
  display: none;
}

/* Style the popup form */
#popup-form {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: #fff;
  padding: 20px;
  border: 3px solid #ddd;
  width: 300px;
}

 .popup-container {
  background-color: #c3c9bf;
  color: white;
  padding: 16px 20px;
  border: none;
  cursor: pointer;
  width: 100%;
  margin: bottom 10px;;
  opacity: 0.8;
}
</style>
</head>
<body>

<!-- Trigger Popup button -->
<button id="popup-button">Open Form</button>

<!-- Popup form container -->
<div id="popup-container" class="popup-container">
  <!-- Popup form -->
  <form action="" id="popup-form">
    <h2>Popup Form</h2>

    <label for="name"><b>Name:</b></label>
    <input type="text" placeholder="Enter Name"  name="name"><br><br>

    <label for="email">Email:</label>
    <input type="email" placeholder="Enter email" name="email"><br><br>

    <button type="submit">Submit</button>
    <button id="close-button">Close</button>
  </form>
</div>

<script>
  // Get the popup button and container
const popupButton = document.getElementById('popup-button');
const popupContainer = document.getElementById('popup-container');
const closeButton = document.getElementById('close-button');
  

// Add event listeners to open and close the popup
popupButton.addEventListener('click', () => {
popupContainer.style.display = 'block';
});

closeButton.addEventListener('click', () => {
popupContainer.style.display = 'none';
});

// Event Listener to closed the popup when clicking outside
window.addEventListener('click', (e) => {
  if (e.target === popupContainer) {
    popupContainer.style.display = 'none';
  } 
});
</script>

</body>
</html>
