<!-- Tic Tac Toe.html -->
<!DOCTYPE html>
<html lang="en">

   <head>
       <title>Play Tic Tac Toe Game</title>
       <meta charset='UTF-8'>
       <meta name='viewport' content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="./css/Tic Tac Toe.css">
   </head>
   <body id='body'>
       <!-- This container is needed to overlay our canvas over table -->
       <div class='center-container' >
           <!-- canvas width and height is within the element. -->
           <h2>Tic Tac Toe Game</h2>
            <canvas id="win-lines" width='400' height='400'></canvas>
            <table>
               <tr>
                   <td id='0' onclick='placeXOrO("0")'></td>
                   <td id='1' onclick='placeXOrO("1")'></td>
                   <td id='2' onclick='placeXOrO("2")'></td>
               </tr>
               <tr>
                   <td id='3' onclick='placeXOrO("3")'></td>
                   <td id='4' onclick='placeXOrO("4")'></td>
                   <td id='5' onclick='placeXOrO("5")'></td>
               </tr>
               <tr>
                   <td id='6' onclick='placeXOrO("6")'></td>
                   <td id='7' onclick='placeXOrO("7")'></td>
                   <td id='8' onclick='placeXOrO("8")'></td>
               </tr>
            </table>
       </div>
       <script src='JS/Tictactoe.js'></script>
   </body>
</html>
